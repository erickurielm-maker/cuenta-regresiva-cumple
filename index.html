<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🎂 Cuenta Regresiva - Cumpleaños Cruz Azul</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="particles"></div>
    <div class="container">
        <h1 id="titulo">⚽ ¡Faltan para mi cumpleaños! 🎂</h1>
        <div class="countdown">
            <div class="box" id="box-dias">
                <span id="dias">00</span>
                <p>Días</p>
            </div>
            <div class="box" id="box-horas">
                <span id="horas">00</span>
                <p>Horas</p>
            </div>
            <div class="box" id="box-minutos">
                <span id="minutos">00</span>
                <p>Minutos</p>
            </div>
            <div class="box" id="box-segundos">
                <span id="segundos">00</span>
                <p>Segundos</p>
            </div>
        </div>
        <div id="mensaje-dia" class="mensaje-dia">
            💪 "El esfuerzo de hoy es el triunfo de mañana"
        </div>
        <div class="botones">
            <button id="btn-confeti" class="btn">🎊 Activar Confeti</button>
            <button id="btn-tema" class="btn">🔵 Cambiar Tema</button>
            <button id="btn-mensaje" class="btn">💬 Nueva Frase</button>
            <button id="btn-musica" class="btn">🔇 Silenciar</button>
        </div>
        <div class="escudo">⚽🏆⚽</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
