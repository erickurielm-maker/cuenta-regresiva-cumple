<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cuenta Regresiva - Cumpleaños 10 Sep</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>🎂 ¡Faltan para mi cumpleaños! 🎂</h1>
        <div class="countdown">
            <div class="box">
                <span id="dias">00</span>
                <p>Días</p>
            </div>
            <div class="box">
                <span id="horas">00</span>
                <p>Horas</p>
            </div>
            <div class="box">
                <span id="minutos">00</span>
                <p>Minutos</p>
            </div>
            <div class="box">
                <span id="segundos">00</span>
                <p>Segundos</p>
            </div>
        </div>
        <p id="mensaje" class="mensaje"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
